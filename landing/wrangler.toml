name = "civilproposals"
compatibility_date = "2026-08-11"
main = "./_worker.js"

# NOTE: the Cloudflare Workers Build config for this project actually has
# Root Directory set to "/" (the repo root) with Deploy command
# "npx wrangler deploy" -- so real deploys (auto-deploy on push to main)
# use ../wrangler.toml, NOT this file. This copy exists only so a manual
# `wrangler deploy` run from inside this "landing" directory still works
# the same way. Keep both files' [vars] in sync if you change either.
#
# Lead-capture form (see index.html's #lead-form, handled in _worker.js).
# RESEND_FROM_EMAIL is not sensitive, so it's fine here as a plain var --
# same value already used on the Railway side, e.g.
# "CivilProposals <noreply@civilproposals.com>". LEAD_NOTIFY_EMAIL is
# optional (defaults to hello@civilproposals.com if omitted).
#
# RESEND_API_KEY is NOT set here on purpose -- it's a secret, so set it via:
#   wrangler secret put RESEND_API_KEY
# (run from this "landing" directory) or the Cloudflare dashboard -> Workers
# & Pages -> civilproposals -> Settings -> Variables and Secrets. This is a
# separate value from Railway's RESEND_API_KEY variable -- same Resend
# account, but each platform needs its own copy of the key.
[vars]
RESEND_FROM_EMAIL = "CivilProposals <noreply@civilproposals.com>"
LEAD_NOTIFY_EMAIL = "hello@civilproposals.com"

[assets]
# The landing page's own static files -- "." means "this directory" since
# this copy of the config lives inside landing/ itself (see ../wrangler.toml
# for the version used from the repo root, where the equivalent path is
# "./landing").
directory = "."
binding = "ASSETS"
# `true` routes EVERY request through the Worker's fetch() first (see
# ../wrangler.toml for the full explanation) -- needed so the www -> apex
# redirect in _worker.js actually gets a chance to run for paths outside
# /app, not just those two.
run_worker_first = true
