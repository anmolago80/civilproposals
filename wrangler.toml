name = "civilproposals"
compatibility_date = "2026-08-11"
# Path is relative to THIS file's location (the repo root) -- the actual
# Worker script lives in landing/ alongside the static site it serves.
main = "./landing/_worker.js"

# THIS is the wrangler.toml that actually matters for deploys: the
# Cloudflare Workers Build config for this project has Root Directory set
# to "/" (repo root) with Deploy command "npx wrangler deploy", so wrangler
# runs from here and reads THIS file -- not landing/wrangler.toml. A copy
# of this [vars] block also lives in landing/wrangler.toml purely so a
# manual `wrangler deploy` run from inside landing/ still works the same
# way; if you ever change these values, update both files.
#
# Lead-capture form (see landing/index.html's #lead-form, handled in
# landing/_worker.js). RESEND_FROM_EMAIL is not sensitive, so it's fine
# here as a plain var -- same value already used on the Railway side, e.g.
# "CivilProposals <noreply@civilproposals.com>". LEAD_NOTIFY_EMAIL is
# optional (defaults to hello@civilproposals.com if omitted).
#
# RESEND_API_KEY is NOT set here on purpose -- it's a secret, so set it via:
#   wrangler secret put RESEND_API_KEY
# (run from this repo's root, or from landing/ -- either works, since
# wrangler resolves the target Worker by its `name` above, not by which
# wrangler.toml you happened to run from) or the Cloudflare dashboard ->
# Workers & Pages -> civilproposals -> Settings -> Variables and Secrets.
# This is a separate value from Railway's RESEND_API_KEY variable -- same
# Resend account, but each platform needs its own copy of the key.
[vars]
RESEND_FROM_EMAIL = "CivilProposals <noreply@civilproposals.com>"
LEAD_NOTIFY_EMAIL = "hello@civilproposals.com"

# Binds this Worker to www.civilproposals.com as well as the bare domain.
# The Cloudflare dashboard's "Connect domain" flow under Domains only
# accepts full apex/root domains, not subdomains like www -- this route
# is the code-driven equivalent, and needs a DNS record for "www" (CNAME,
# proxied through Cloudflare -- the orange cloud) to exist so traffic
# reaches Cloudflare's edge in the first place. The record's target
# barely matters since this route intercepts the request before it would
# ever be forwarded anywhere; pointing it at civilproposals.com is fine.
[[routes]]
pattern = "www.civilproposals.com/*"
zone_name = "civilproposals.com"

[assets]
# Also relative to the repo root. Wrangler's own auto-detection already
# recognized "landing" as the output directory (from the Cloudflare
# project's dashboard settings) -- this just needs to agree with that so
# the custom Worker script above actually gets used instead of Wrangler
# falling back to static-only zero-config mode.
directory = "./landing"
binding = "ASSETS"
# Everything under /app runs the Worker (_worker.js) first instead of
# going straight to static assets -- that's what lets /app/* reverse-proxy
# through to the Streamlit app on Railway instead of 404ing as a missing
# static file. Every other path (/, /privacy-policy.html, etc.) still goes
# straight to static assets as before.
run_worker_first = ["/app", "/app/*"]
