[theme]
# CivilProposals brand palette -- "modern & confident": a vivid, saturated
# blue (not the muted steel-blue of a first pass) with a high-contrast near-
# black ink color and an orange accent used sparingly for CTAs/highlights.
# Kept in sync with modules/branding.py and landing/index.html -- update all
# three together if the brand colors ever change.
primaryColor = "#1D4ED8"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F8FAFC"
textColor = "#0F172A"
font = "sans serif"

[server]
headless = true
enableCORS = false
enableXsrfProtection = true
# Served behind civilproposals.com/app via a Cloudflare Pages Function
# reverse proxy (landing/functions/app/[[path]].js) -- no more app.
# subdomain. Streamlit needs to know its own base path so it generates
# correct asset/websocket URLs under /app/... instead of /...
baseUrlPath = "app"

[browser]
gatherUsageStats = false
