[theme]
# CivilProposals brand palette -- "modern & confident": a vivid, saturated
# blue (not the muted steel-blue of a first pass) with a high-contrast near-
# black ink color and an orange accent used sparingly for CTAs/highlights.
# Kept in sync with modules/branding.py and landing/index.html -- update all
# three together if the brand colors ever change.
primaryColor = "#1D4ED8"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F8FAFC"
textColor = "#0F172A"
font = "sans serif"

[server]
headless = true
enableCORS = false
enableXsrfProtection = true
# Served directly at app.civilproposals.com (a Railway custom domain
# pointed straight at this service -- confirmed live via `railway domain`
# and the Railway dashboard), NOT behind a civilproposals.com/app path
# proxy -- that architecture was superseded (see landing/_worker.js's
# top-of-file comment) but this file was never updated to match, so
# Streamlit kept generating asset/websocket URLs under /app/... and
# refusing to serve anything at "/", which is exactly what the custom
# domain actually requests. Left as the default (root) base path so
# Streamlit serves at "/" -- do NOT reintroduce "app" unless the site
# goes back to path-based proxying.
baseUrlPath = ""

[browser]
gatherUsageStats = false
